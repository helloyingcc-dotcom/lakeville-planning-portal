<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lakeville Events App · Essentials prototype</title>
<style>
:root{--navy:#1c2a4b;--navy2:#26386a;--gold:#e2a634;--ink:#1f2937;--muted:#6b7280;--line:#e5e8ef;--bg:#f4f6fa;--card:#fff;--green:#2e8b57;--amber:#d48a00;--red:#c2410c;--soft:#eef2f9}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
h1,h2,h3,p{margin:0}
.proto-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff8e6;border-bottom:1px solid #f1dfb2;color:#7a5a17;padding:7px 14px;font-size:12px}
.proto-bar strong{color:#5c430e}
.switch{margin-left:auto;flex-shrink:0;display:flex;background:#fff;border:1px solid #e9d6a6;border-radius:8px;padding:2px}
.switch button{border:0;background:transparent;padding:5px 10px;border-radius:6px;color:#7a5a17;font-size:12px}
.switch button[aria-pressed=true]{background:var(--navy);color:#fff}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:600;font-size:13px}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #cfd6e6}
.btn.gold{background:var(--gold);color:#1c2a4b}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.verified{background:#e3f4ea;color:#1f6b42}.pill.pending{background:#fff1d6;color:#8a5a00}.pill.unpaid{background:#fde7dd;color:#9a3412}.pill.in{background:#e6ecfa;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;border:1px solid #d4d9e5;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}
label.f{display:grid;gap:5px;font-size:12px;color:#4b5563;font-weight:600}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50}
/* ---------- PTA admin ---------- */
.admin{display:flex;min-height:calc(100vh - 34px)}
.side{width:210px;flex-shrink:0;background:var(--navy);color:#cfd6e8;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.side .brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;padding:4px 8px 14px}
.side .brand img{width:34px}
.side .brand small{display:block;font-weight:500;color:#aab4cc;font-size:10px}
.side button{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#cfd6e8;text-align:left;padding:10px 10px;border-radius:8px;font-size:13px}
.side button[aria-current=page]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side .ev{margin-top:auto;font-size:11px;color:#aab4cc;padding:8px}
.side select{background:#24355e;color:#fff;border-color:#3a4c7a;margin-top:4px;font-size:12px}
.main{flex:1;min-width:0;padding:22px 26px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{display:flex;gap:12px;align-items:center}
.stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:8px auto}
.donut div{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut b{font-size:22px;color:var(--navy)}
.legend{display:grid;gap:6px;font-size:12px}.legend i{font-style:normal;display:flex;align-items:center}.legend span{display:flex;justify-content:space-between;gap:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--navy);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--muted);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#f8f9fc}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{max-width:300px}
.toolbar select{width:auto}
.drawer-bg{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:30;display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);height:100%;background:#fff;padding:20px;overflow:auto;display:grid;gap:14px;align-content:start}
.member{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.member.on{background:#eef7f1;border-color:#bfe2cc}
.desk-search{font-size:18px!important;padding:14px 16px!important;border-radius:12px!important}
.result{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.result.done{background:#f0f8f3;border-color:#bfe2cc}
.note{background:var(--soft);border:1px solid #d9e0ee;border-radius:10px;padding:10px 12px;font-size:12px;color:#3c4a6b}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check .n{min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700}
.n.ok{background:#e3f4ea;color:#1f6b42}.n.warn{background:#fff1d6;color:#8a5a00}
.email{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.email .head{background:var(--navy);color:#fff;padding:10px 14px;font-size:12px}
.email .body{padding:14px;display:grid;gap:8px;font-size:13px}
/* ---------- parent phone ---------- */
.phone{max-width:430px;margin:0 auto;min-height:calc(100vh - 34px);background:#fff;display:flex;flex-direction:column}
.p-head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.p-head img{width:36px}
.p-head b{display:block}.p-head small{color:#c9d2e6;font-size:11px}
.p-body{flex:1;padding:16px;display:grid;gap:12px;align-content:start;background:var(--bg)}
.p-tabs{display:flex;border-top:1px solid var(--line);background:#fff}
.p-tabs button{flex:1;border:0;background:#fff;padding:12px 4px;color:var(--muted);font-size:12px}
.p-tabs button[aria-current=page]{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
.evcard{display:grid;gap:6px;cursor:pointer}
.evcard h3{color:var(--navy);font-size:16px}
.back{border:0;background:none;color:var(--navy);padding:0;font-size:13px;justify-self:start}
.ticket{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 18px rgba(28,42,75,.08)}
.ticket .t-top{background:var(--navy);color:#fff;padding:14px 16px}
.ticket .t-top small{color:#c9d2e6}
.ticket .t-mid{padding:16px;display:grid;gap:10px;justify-items:center;text-align:center}
.ticket .t-bot{border-top:2px dashed var(--line);padding:12px 16px;display:grid;gap:6px;font-size:13px}
.qr{width:170px;height:170px;image-rendering:pixelated;border:8px solid #fff;outline:1px solid var(--line)}
.ok-screen{background:var(--green);color:#fff;border-radius:18px;padding:28px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.ok-screen .big{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-size:48px;font-weight:700}
.ok-screen.pending{background:var(--amber)}
.kid{display:flex;gap:8px}
@media(max-width:820px){
  .admin{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;align-items:center}
  .side .brand{padding:0 8px 0 2px}.side .brand small,.side .ev label{display:none}
  .side button{white-space:nowrap;padding:8px 10px}
  .side .ev{margin:0;padding:0 6px}
  .main{padding:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="lakeville-concept" hidden></div>
<div class="proto-bar"><strong>Prototype</strong><span class="hide-sm">· sample data only, resets when reloaded · School-Year Essentials</span>
  <div class="switch" role="group" aria-label="View as">
    <button data-act="mode" data-v="admin" id="mode-admin">PTA team</button>
    <button data-act="mode" data-v="parent" id="mode-parent">Parent</button>
  </div>
</div>
<div id="app"></div>
<script>
'use strict';
const LION = '__LION_DATA__';
/* ---------------- sample data (fictional) ---------------- */
const QTYPES = { text: 'Short answer', number: 'Number', select: 'Dropdown', check: 'Checkbox' };
const EVENTS = [
  { id: 'gn', name: 'Family Game Night', date: 'Fri, Feb 5', time: '5:00–8:00 PM', place: 'Gym & classrooms', price: 10, unit: 'family', note: 'Two sessions; pick your top 3 games when you arrive.', ics: ['20270205T170000', '20270205T200000'], slots: [{ id: 's1', role: 'Ticket table', time: '4:30–6:00 PM', need: 2, people: ['Grace Haddad'] }, { id: 's2', role: 'Game hosts', time: '5:00–8:00 PM', need: 6, people: ['Daniel Lee', 'Amy Chen', 'Raj Patel'] }, { id: 's3', role: 'Clean-up crew', time: '8:00–8:30 PM', need: 3, people: [] }], questions: [{ id: 'q1', label: 'Family T-shirt size (optional)', type: 'select', options: ['Youth S', 'Youth M', 'Adult M', 'Adult L'], required: false }] },
  { id: 'sd', name: 'Sweetheart Dance', date: 'Fri, Feb 12', time: '6:00–8:00 PM', place: 'Cafeteria', price: 8, unit: 'child', note: 'Wristbands at the door for paid tickets.', ics: ['20270212T180000', '20270212T200000'], slots: [{ id: 's4', role: 'Door & wristbands', time: '5:45–7:00 PM', need: 2, people: [] }], questions: [] },
  { id: 'ln', name: 'Literacy Night', date: 'Thu, Mar 4', time: '6:00–7:30 PM', place: 'Library', price: 0, unit: 'family', note: 'Free event. Optional pizza pre-order ($5 for 2 slices).', extra: 'Pizza orders (2 slices, $5 each)', ics: ['20270304T180000', '20270304T193000'], slots: [{ id: 's5', role: 'Pizza table', time: '5:45–7:00 PM', need: 2, people: ['Maria Garcia'] }], questions: [] },
  { id: 'cs', name: 'Car Show', date: 'Sat, May 15', time: '10:00 AM–2:00 PM', place: 'Front lot · 3 entrances', price: 5, unit: 'person', note: 'Pay at any of the three entrances.', ics: ['20270515T100000', '20270515T140000'], slots: [{ id: 's6', role: 'Entrance gates (2 per gate)', time: '9:30 AM–2:00 PM', need: 6, people: ['Sean Murphy', 'Yuki Tanaka'] }], questions: [{ id: 'q2', label: 'Bringing a car to show?', type: 'check', required: false }] }
];
const LAST = ['Lee','Chen','Wong','Smith','Kim','Patel','Garcia','Nguyen','Brown','Rossi','Cohen','Okafor','Silva','Murphy','Tanaka','Haddad','Novak','Ali','Park','Lopez','Fischer','Rivera'];
const FIRST = ['Ava','Leo','Mia','Noah','Zoe','Eli','Ivy','Max','Lily','Sam','Ruby','Owen','Nora','Jack','Ella','Theo','Maya','Finn','Aria','Kai','June','Luca','Rosa','Ezra'];
const PARENT = ['Grace','Daniel','Amy','Mark','Jenny','Raj','Maria','Linh','Chris','Sofia','Rachel','Tunde','Paula','Sean','Yuki','Omar','Ana','Sara','Min','Carlos','Heidi','Luis'];
const METHODS = ['Zelle','Cash','Check','Envelope'];
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
let fams = [];
EVENTS.forEach(ev => {
  const n = ev.id === 'cs' ? 14 : 20;
  for (let i = 0; i < n; i++) {
    const last = LAST[(i + ev.id.charCodeAt(0)) % LAST.length], kids = 1 + Math.floor(rnd() * 3);
    const students = Array.from({ length: kids }, (_, k) => ({ name: FIRST[(i * 3 + k + ev.id.length) % FIRST.length] + ' ' + last, grade: ['K', '1', '2', '3', '4', '5'][Math.floor(rnd() * 6)], in: false }));
    const adults = [{ name: PARENT[(i + ev.id.charCodeAt(1)) % PARENT.length] + ' ' + last, in: false }];
    if (rnd() > .55) adults.push({ name: 'Guest of ' + last, in: false });
    const r = rnd(), status = ev.price === 0 && !ev.extra ? 'verified' : r < .7 ? 'verified' : r < .88 ? 'pending' : 'unpaid';
    fams.push({ id: ev.id + i, ev: ev.id, code: (ev.id + '-' + (1000 + i * 37)).toUpperCase(), parent: adults[0].name, email: adults[0].name.toLowerCase().replace(/\s+/g, '.') + '@example.com', members: [...adults, ...students], status, method: status === 'unpaid' ? '' : METHODS[Math.floor(rnd() * 4)], pizza: ev.extra ? Math.floor(rnd() * 3) : 0, sent: rnd() > .1, walkin: false, checkins: [] });
  }
});
// a few already checked in so the dashboard has life
fams.filter(f => f.ev === 'gn').slice(0, 6).forEach((f, i) => { f.members.forEach(m => m.in = true); f.checkins.push(`6:${String(12 - i).padStart(2, '0')} PM`); });
const SENT = {};
const S = { shared: false, helper: '', imp: null, maps: {}, lastImport: {}, myEmail: '', mode: innerWidth < 600 ? 'parent' : 'admin', view: 'dash', ev: 'gn', q: '', pay: 'all', open: null, desk: '', pv: 'events', pev: null, myTickets: [], showTicket: null, toast: '' };
/* ---------------- Google Form responses (simulated) ----------------
   Essentials: each event's sign-up is a Google Form run by the PTA. A volunteer downloads the
   responses as CSV and imports them; the app matches columns once and never makes duplicates. */
const FORM_HEADERS = ev => ['Timestamp', 'Parent/guardian name', 'Email address', 'Student name', 'Student grade', 'Second student (optional)', 'Second student grade', 'Other adults coming', ...(ev.extra ? [ev.extra] : []), ...(ev.price || ev.extra ? ['How will you pay?'] : []), ...(ev.id === 'gn' ? ['Family T-shirt size (optional)'] : [])];
const RESP = {};
EVENTS.forEach((ev, k) => {
  const H = FORM_HEADERS(ev), row = (vals) => Object.fromEntries(H.map((h, i) => [h, vals[i] ?? '']));
  const pay = ev.price || ev.extra ? ['Zelle'] : [];
  const extra = ev.extra ? ['1'] : [];
  RESP[ev.id] = [
    row(['11/9/2026 18:02', 'Priya Shah', 'priya.shah@example.com', 'Anika Shah', '2', '', '', '1', ...extra, ...pay]),
    row(['11/10/2026 07:45', 'Tom Becker', 'tom.becker@example.com', 'Ella Becker', 'K', 'Max Becker', '3', '0', ...extra, ...(pay.length ? ['Cash'] : [])]),
    row(['11/10/2026 21:13', 'Dana Ortiz', 'dana.ortiz@example.com', 'Leo Ortiz', '4', '', '', '2', ...extra, ...pay])
  ];
  // one family already in the app re-submits with a change (an extra adult) → shows as "updated", not a duplicate
  const f = fams.find(x => x.ev === ev.id);
  const kids = f.members.filter(m => m.grade);
  RESP[ev.id].push(row(['11/11/2026 08:30', f.parent, f.email, kids[0]?.name || '', kids[0]?.grade || '', kids[1]?.name || '', kids[1]?.grade || '', String(f.members.filter(m => !m.grade).length), ...(ev.extra ? [String(f.pizza)] : []), ...(pay.length ? [f.method || 'Zelle'] : [])]));
});
// Game Night's team added their own question; the app keeps it as an "other answer"
RESP.gn.forEach((r, i) => { r['Family T-shirt size (optional)'] = ['Youth M', 'Adult L', '', 'Youth S'][i] || ''; });
const APP_FIELDS = ev => [['parent', 'Parent name', true], ['email', 'Email', true], ['kid1', 'Student name', true], ['g1', 'Student grade'], ['kid2', 'Second student'], ['g2', 'Second student grade'], ['adults', 'Other adults coming'], ...(ev.extra ? [['pizza', ev.extra]] : []), ...(ev.price || ev.extra ? [['method', 'Payment method']] : [])];
function guessMap(ev, headers) {
  const pick = (re, not) => headers.find(h => re.test(h) && !(not && not.test(h))) || '';
  const kid = /student|child|kid/i, second = /second|2nd|another|\b2\b/i;
  return { parent: pick(/parent|guardian/i) || pick(/name/i, kid), email: pick(/e-?mail/i), kid1: pick(kid, /grade|second|2nd|another|\b2\b/i), g1: pick(/grade/i, second), kid2: pick(new RegExp('(' + second.source + ').*(' + kid.source + ')|(' + kid.source + ').*(' + second.source + ')', 'i'), /grade/i), g2: headers.find(h => /grade/i.test(h) && second.test(h)) || '', adults: pick(/adult/i), pizza: ev.extra ? pick(/pizza/i) : '', method: pick(/pay/i) };
}
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim()));
  const headers = (clean.shift() || []).map(h => h.trim());
  return { headers, rows: clean.map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] || '').trim()]))) };
}
const toCsv = (headers, rows) => [headers, ...rows.map(r => headers.map(h => r[h] ?? ''))].map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
function planImport(ev, imp) {
  const m = imp.map, get = (r, k) => (m[k] ? String(r[m[k]] ?? '').trim() : '');
  const seen = new Set();
  return imp.rows.map(r => {
    const parent = get(r, 'parent'), email = get(r, 'email').toLowerCase(), last = parent.split(' ').pop();
    if (!parent || !/^\S+@\S+\.\S+$/.test(email)) return { status: 'skip', why: !parent ? 'No parent name' : 'No valid email', parent: parent || '—', email };
    if (seen.has(email)) return { status: 'skip', why: 'Same email twice in this file (kept the first)', parent, email };
    seen.add(email);
    const kids = [[get(r, 'kid1'), get(r, 'g1')], [get(r, 'kid2'), get(r, 'g2')]].filter(([n]) => n).map(([n, g]) => ({ name: n.includes(' ') ? n : n + ' ' + last, grade: g || '?', in: false }));
    const adults = [{ name: parent, in: false }, ...Array.from({ length: Math.min(9, +get(r, 'adults') || 0) }, (_, i) => ({ name: i ? 'Guest ' + (i + 1) + ' of ' + last : 'Guest of ' + last, in: false }))];
    const method = get(r, 'method').replace(/envelope.*/i, 'Envelope'), pizza = +get(r, 'pizza') || 0;
    const existing = fams.find(f => f.ev === ev.id && f.email.toLowerCase() === email);
    const members = [...adults, ...kids];
    const used = new Set(Object.values(m).filter(Boolean));
    const other = Object.fromEntries(Object.entries(r).filter(([h, v]) => v && !used.has(h) && !/^timestamp$/i.test(h)));
    if (existing) {
      const same = existing.members.map(x => x.name).join('|') === members.map(x => x.name).join('|') && (existing.method || '') === (method || existing.method || '') && (existing.pizza || 0) === pizza && JSON.stringify(existing.other || {}) === JSON.stringify(other);
      return { status: same ? 'same' : 'update', parent, email, members, method, pizza, other, existing };
    }
    return { status: 'new', parent, email, members, method, pizza, other };
  });
}

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const evOf = id => EVENTS.find(e => e.id === id);
const famsOf = id => fams.filter(f => f.ev === id);
const people = f => f.members.length;
const inCount = f => f.members.filter(m => m.in).length;
const amount = f => { const ev = evOf(f.ev); const base = ev.unit === 'family' ? ev.price : ev.unit === 'child' ? ev.price * f.members.filter(m => m.grade).length : ev.price * people(f); return base + (f.pizza || 0) * 5; };
const money = n => '$' + n.toLocaleString();
const initials = n => n.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
const PILL = { verified: '<span class="pill verified">✓ Verified</span>', pending: '<span class="pill pending">● Pending</span>', unpaid: '<span class="pill unpaid">✕ Not paid</span>' };
function toast(t) { S.toast = t; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; render(); }, 2200); }
function nowTime() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function qrSvg(code) { // sample code pattern (not a scannable QR) seeded from the ticket code

  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  for (let x = 0; x < n; x++) for (let y = 0; y < n; y++) { const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9); if (!inF && r() > .52) cells.push([x, y]); }

}

  if (t.dataset.act === 'ev') { S.ev = t.value; S.open = null; S.imp = null; }
  else if (t.dataset.act === 'mapcol') S.imp.map[t.dataset.v] = t.value;
  else if (t.dataset.act === 'csvfile') { const file = t.files[0]; if (!file) return; file.text().then(text => { startImport(evOf(S.ev), file.name, text); render(); }); return; }
  else if (t.dataset.act === 'payf') S.pay = t.value;
  else if (t.dataset.act === 'setpay') { f.status = t.value; if (t.value === 'verified') toast('Verified · updated ✅ ticket emailed'); }
  else if (t.dataset.act === 'setmethod' || t.dataset.act === 'quickmethod') f.method = t.value;
  else return;
  render();
});
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'q') { S.q = e.target.value; render(); }
  if (e.target.dataset.act === 'desk') { S.desk = e.target.value; render(); }
  if (e.target.dataset.act === 'helper') { S.helper = e.target.value; }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'signup') return; e.preventDefault();
  const d = new FormData(e.target), ev = evOf(S.pev), last = String(d.get('parent')).trim().split(' ').pop();
  const kids = [[d.get('kid1'), d.get('g1')], [d.get('kid2'), d.get('g2')]].filter(([n]) => String(n || '').trim()).map(([n, g]) => ({ name: String(n).trim().includes(' ') ? String(n).trim() : String(n).trim() + ' ' + last, grade: g, in: false }));
  const adults = [{ name: String(d.get('parent')).trim(), in: false }, ...Array.from({ length: Math.min(9, +d.get('adults') || 0) }, (_, i) => ({ name: i ? 'Guest ' + (i + 1) + ' of ' + last : 'Guest of ' + last, in: false }))];
  const other = {}; ev.questions.forEach(q => { const v = q.type === 'check' ? (d.get('cq_' + q.id) ? 'Yes' : '') : String(d.get('cq_' + q.id) || '').trim(); if (v) other[q.label] = v; });
  const email = String(d.get('email')).trim().toLowerCase();
  const existing = fams.find(f => f.ev === ev.id && f.email.toLowerCase() === email);
  if (existing) { S.myEmail = email; S.pv = 'tickets'; S.pev = null; toast('You’re already signed up. Your ticket is below.'); return; }
  const f = { id: 'me' + Date.now(), ev: ev.id, code: (ev.id + '-' + Math.floor(Math.random() * 9000 + 1000)).toUpperCase(), parent: adults[0].name, email, members: [...adults, ...kids], status: ev.price || +d.get('pizza') ? 'pending' : 'verified', method: String(d.get('method') || '').replace(/envelope.*/i, 'Envelope'), pizza: +d.get('pizza') || 0, other, sent: true, walkin: false, checkins: [] };
  fams.push(f); S.myEmail = email; S.pv = 'tickets'; S.pev = null; S.ev = ev.id;
  toast('You’re signed up! Ticket emailed to ' + email); return;
  render();
});
render();
</script>
</body>
</html>
