<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lakeville Events App · Essentials prototype</title>
<style>
:root{--navy:#1c2a4b;--navy2:#26386a;--gold:#e2a634;--ink:#1f2937;--muted:#6b7280;--line:#e5e8ef;--bg:#f4f6fa;--card:#fff;--green:#2e8b57;--amber:#d48a00;--red:#c2410c;--soft:#eef2f9}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
h1,h2,h3,p{margin:0}
.proto-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff8e6;border-bottom:1px solid #f1dfb2;color:#7a5a17;padding:7px 14px;font-size:12px}
.proto-bar strong{color:#5c430e}
.switch{margin-left:auto;flex-shrink:0;display:flex;background:#fff;border:1px solid #e9d6a6;border-radius:8px;padding:2px}
.switch button{border:0;background:transparent;padding:5px 10px;border-radius:6px;color:#7a5a17;font-size:12px}
.switch button[aria-pressed=true]{background:var(--navy);color:#fff}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:600;font-size:13px}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid #cfd6e6}
.btn.gold{background:var(--gold);color:#1c2a4b}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.verified{background:#e3f4ea;color:#1f6b42}.pill.pending{background:#fff1d6;color:#8a5a00}.pill.unpaid{background:#fde7dd;color:#9a3412}.pill.in{background:#e6ecfa;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;border:1px solid #d4d9e5;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}
label.f{display:grid;gap:5px;font-size:12px;color:#4b5563;font-weight:600}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50}
/* ---------- PTA admin ---------- */
.admin{display:flex;min-height:calc(100vh - 34px)}
.side{width:210px;flex-shrink:0;background:var(--navy);color:#cfd6e8;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.side .brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;padding:4px 8px 14px}
.side .brand img{width:34px}
.side .brand small{display:block;font-weight:500;color:#aab4cc;font-size:10px}
.side button{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#cfd6e8;text-align:left;padding:10px 10px;border-radius:8px;font-size:13px}
.side button[aria-current=page]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side .ev{margin-top:auto;font-size:11px;color:#aab4cc;padding:8px}
.side select{background:#24355e;color:#fff;border-color:#3a4c7a;margin-top:4px;font-size:12px}
.main{flex:1;min-width:0;padding:22px 26px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{display:flex;gap:12px;align-items:center}
.stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:8px auto}
.donut div{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.donut b{font-size:22px;color:var(--navy)}
.legend{display:grid;gap:6px;font-size:12px}.legend i{font-style:normal;display:flex;align-items:center}.legend span{display:flex;justify-content:space-between;gap:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--navy);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--muted);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#f8f9fc}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{max-width:300px}
.toolbar select{width:auto}
.drawer-bg{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:30;display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);height:100%;background:#fff;padding:20px;overflow:auto;display:grid;gap:14px;align-content:start}
.member{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.member.on{background:#eef7f1;border-color:#bfe2cc}
.desk-search{font-size:18px!important;padding:14px 16px!important;border-radius:12px!important}
.result{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.result.done{background:#f0f8f3;border-color:#bfe2cc}
.note{background:var(--soft);border:1px solid #d9e0ee;border-radius:10px;padding:10px 12px;font-size:12px;color:#3c4a6b}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check .n{min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700}
.n.ok{background:#e3f4ea;color:#1f6b42}.n.warn{background:#fff1d6;color:#8a5a00}
.email{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.email .head{background:var(--navy);color:#fff;padding:10px 14px;font-size:12px}
.email .body{padding:14px;display:grid;gap:8px;font-size:13px}
/* ---------- parent phone ---------- */
.phone{max-width:430px;margin:0 auto;min-height:calc(100vh - 34px);background:#fff;display:flex;flex-direction:column}
.p-head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.p-head img{width:36px}
.p-head b{display:block}.p-head small{color:#c9d2e6;font-size:11px}
.p-body{flex:1;padding:16px;display:grid;gap:12px;align-content:start;background:var(--bg)}
.p-tabs{display:flex;border-top:1px solid var(--line);background:#fff}
.p-tabs button{flex:1;border:0;background:#fff;padding:12px 4px;color:var(--muted);font-size:12px}
.p-tabs button[aria-current=page]{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
.evcard{display:grid;gap:6px;cursor:pointer}
.evcard h3{color:var(--navy);font-size:16px}
.back{border:0;background:none;color:var(--navy);padding:0;font-size:13px;justify-self:start}
.ticket{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 18px rgba(28,42,75,.08)}
.ticket .t-top{background:var(--navy);color:#fff;padding:14px 16px}
.ticket .t-top small{color:#c9d2e6}
.ticket .t-mid{padding:16px;display:grid;gap:10px;justify-items:center;text-align:center}
.ticket .t-bot{border-top:2px dashed var(--line);padding:12px 16px;display:grid;gap:6px;font-size:13px}
.qr{width:170px;height:170px;image-rendering:pixelated;border:8px solid #fff;outline:1px solid var(--line)}
.ok-screen{background:var(--green);color:#fff;border-radius:18px;padding:28px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.ok-screen .big{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-size:48px;font-weight:700}
.ok-screen.pending{background:var(--amber)}
.kid{display:flex;gap:8px}
@media(max-width:820px){
  .admin{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;align-items:center}
  .side .brand{padding:0 8px 0 2px}.side .brand small,.side .ev label{display:none}
  .side button{white-space:nowrap;padding:8px 10px}
  .side .ev{margin:0;padding:0 6px}
  .main{padding:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="lakeville-concept" hidden></div>
<div class="proto-bar"><strong>Prototype</strong><span class="hide-sm">· sample data only, resets when reloaded · School-Year Essentials</span>
  <div class="switch" role="group" aria-label="View as">
    <button data-act="mode" data-v="admin" id="mode-admin">PTA team</button>
    <button data-act="mode" data-v="parent" id="mode-parent">Parent</button>
  </div>
</div>
<div id="app"></div>
<script>
'use strict';
const LION = '__LION_DATA__';
/* ---------------- sample data (fictional) ---------------- */
const EVENTS = [
  { id: 'gn', name: 'Family Game Night', date: 'Fri, Feb 5', time: '5:00–8:00 PM', place: 'Gym & classrooms', price: 10, unit: 'family', note: 'Two sessions; pick your top 3 games when you arrive.' },
  { id: 'sd', name: 'Sweetheart Dance', date: 'Fri, Feb 12', time: '6:00–8:00 PM', place: 'Cafeteria', price: 8, unit: 'child', note: 'Wristbands at the door for paid tickets.' },
  { id: 'ln', name: 'Literacy Night', date: 'Thu, Mar 4', time: '6:00–7:30 PM', place: 'Library', price: 0, unit: 'family', note: 'Free event. Optional pizza pre-order ($5 for 2 slices).', extra: 'Pizza orders (2 slices, $5 each)' },
  { id: 'cs', name: 'Car Show', date: 'Sat, May 15', time: '10:00 AM–2:00 PM', place: 'Front lot · 3 entrances', price: 5, unit: 'person', note: 'Pay at any of the three entrances.' }
];
const LAST = ['Lee','Chen','Wong','Smith','Kim','Patel','Garcia','Nguyen','Brown','Rossi','Cohen','Okafor','Silva','Murphy','Tanaka','Haddad','Novak','Ali','Park','Lopez','Fischer','Rivera'];
const FIRST = ['Ava','Leo','Mia','Noah','Zoe','Eli','Ivy','Max','Lily','Sam','Ruby','Owen','Nora','Jack','Ella','Theo','Maya','Finn','Aria','Kai','June','Luca','Rosa','Ezra'];
const PARENT = ['Grace','Daniel','Amy','Mark','Jenny','Raj','Maria','Linh','Chris','Sofia','Rachel','Tunde','Paula','Sean','Yuki','Omar','Ana','Sara','Min','Carlos','Heidi','Luis'];
const METHODS = ['Zelle','Cash','Check','Envelope'];
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
let fams = [];
EVENTS.forEach(ev => {
  const n = ev.id === 'cs' ? 14 : 20;
  for (let i = 0; i < n; i++) {
    const last = LAST[(i + ev.id.charCodeAt(0)) % LAST.length], kids = 1 + Math.floor(rnd() * 3);
    const students = Array.from({ length: kids }, (_, k) => ({ name: FIRST[(i * 3 + k + ev.id.length) % FIRST.length] + ' ' + last, grade: ['K', '1', '2', '3', '4', '5'][Math.floor(rnd() * 6)], in: false }));
    const adults = [{ name: PARENT[(i + ev.id.charCodeAt(1)) % PARENT.length] + ' ' + last, in: false }];
    if (rnd() > .55) adults.push({ name: 'Guest of ' + last, in: false });
    const r = rnd(), status = ev.price === 0 && !ev.extra ? 'verified' : r < .7 ? 'verified' : r < .88 ? 'pending' : 'unpaid';
    fams.push({ id: ev.id + i, ev: ev.id, code: (ev.id + '-' + (1000 + i * 37)).toUpperCase(), parent: adults[0].name, email: adults[0].name.split(' ')[0].toLowerCase() + '@example.com', members: [...adults, ...students], status, method: status === 'unpaid' ? '' : METHODS[Math.floor(rnd() * 4)], pizza: ev.extra ? Math.floor(rnd() * 3) : 0, sent: rnd() > .1, walkin: false, checkins: [] });
  }
});
// a few already checked in so the dashboard has life
fams.filter(f => f.ev === 'gn').slice(0, 6).forEach((f, i) => { f.members.forEach(m => m.in = true); f.checkins.push(`6:${String(12 - i).padStart(2, '0')} PM`); });
const S = { mode: innerWidth < 600 ? 'parent' : 'admin', view: 'dash', ev: 'gn', q: '', pay: 'all', open: null, desk: '', pv: 'events', pev: null, myTickets: [], showTicket: null, toast: '' };
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const evOf = id => EVENTS.find(e => e.id === id);
const famsOf = id => fams.filter(f => f.ev === id);
const people = f => f.members.length;
const inCount = f => f.members.filter(m => m.in).length;
const amount = f => { const ev = evOf(f.ev); const base = ev.unit === 'family' ? ev.price : ev.unit === 'child' ? ev.price * f.members.filter(m => m.grade).length : ev.price * people(f); return base + (f.pizza || 0) * 5; };
const money = n => '$' + n.toLocaleString();
const initials = n => n.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
const PILL = { verified: '<span class="pill verified">✓ Verified</span>', pending: '<span class="pill pending">● Pending</span>', unpaid: '<span class="pill unpaid">✕ Not paid</span>' };
function toast(t) { S.toast = t; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; render(); }, 2200); }
function nowTime() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function qrSvg(code) { // sample code pattern (not a scannable QR) seeded from the ticket code
  let h = 0; for (const c of code) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const n = 25, cells = []; const r = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const finder = (x, y) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) if (i === 0 || j === 0 || i === 6 || j === 6 || (i > 1 && i < 5 && j > 1 && j < 5)) cells.push([x + i, y + j]); };
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  for (let x = 0; x < n; x++) for (let y = 0; y < n; y++) { const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9); if (!inF && r() > .52) cells.push([x, y]); }
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" role="img" aria-label="Sample ticket code ${esc(code)}">${cells.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1"/>`).join('')}</svg>`;
}
/* ---------------- PTA admin ---------------- */
const NAV = [['dash', '▦', 'Dashboard'], ['regs', '👥', 'Registrations'], ['desk', '✓', 'Check-in desk'], ['pay', '$', 'Payments'], ['review', '☑', 'Pre-event review'], ['reports', '↓', 'Reports & export'], ['emails', '✉', 'Automated emails']];
function admin() {
  const ev = evOf(S.ev), list = famsOf(S.ev);
  const body = { dash, regs, desk, pay, review, reports, emails }[S.view](ev, list);
  return `<div class="admin"><aside class="side">
    <div class="brand"><img src="${LION}" alt=""><div>Lakeville PTA<small>Events</small></div></div>
    ${NAV.map(([id, ic, label]) => `<button data-act="view" data-v="${id}" ${S.view === id ? 'aria-current="page"' : ''}><span aria-hidden="true">${ic}</span>${label}</button>`).join('')}
    <div class="ev"><label>Event</label><select data-act="ev" aria-label="Event">${EVENTS.map(e => `<option value="${e.id}" ${e.id === S.ev ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
  </aside><main class="main">${body}</main></div>${S.open ? drawer() : ''}`;
}
function head(title, sub, right = '') { return `<div class="top"><div><h1>${title}</h1><p class="muted">${sub}</p></div>${right}</div>`; }
function dash(ev, list) {
  const reg = list.reduce((n, f) => n + people(f), 0), ins = list.reduce((n, f) => n + inCount(f), 0);
  const ver = list.filter(f => f.status === 'verified'), pen = list.filter(f => f.status === 'pending'), un = list.filter(f => f.status === 'unpaid');
  const pct = list.length ? Math.round(ver.length / list.length * 100) : 0, a = ver.length / (list.length || 1) * 360, b = a + pen.length / (list.length || 1) * 360;
  const recent = list.filter(f => f.checkins.length).slice(-6).reverse();
  return head(esc(ev.name), `${esc(ev.date)} · ${esc(ev.time)} · ${esc(ev.place)}`, `<button class="btn" data-act="view" data-v="desk">Open check-in desk</button>`) +
  `<div class="stats">
    <div class="card stat"><div class="ic" style="background:#e6ecfa">👥</div><div><b>${reg}</b><span>Registered guests</span></div></div>
    <div class="card stat"><div class="ic" style="background:#e3f4ea">✓</div><div><b>${ins}</b><span>Checked in</span></div></div>
    <div class="card stat"><div class="ic" style="background:#f1e9fb">%</div><div><b>${reg ? Math.round(ins / reg * 100) : 0}%</b><span>Attendance rate</span></div></div>
    <div class="card stat"><div class="ic" style="background:#fff1d6">$</div><div><b>${money(ver.reduce((n, f) => n + amount(f), 0))}</b><span>Payments verified</span></div></div>
  </div>
  <div class="grid3">
    <div class="card"><h3>Payment status</h3>
      <div class="donut" style="background:conic-gradient(var(--green) 0 ${a}deg,#f1c04a ${a}deg ${b}deg,#e76f51 ${b}deg 360deg)"><div><b>${pct}%</b><small class="muted">Verified</small></div></div>
      <div class="legend"><span><i><span class="dot" style="background:var(--green)"></span>Verified</i><b>${ver.length}</b></span><span><i><span class="dot" style="background:#f1c04a"></span>Pending</i><b>${pen.length}</b></span><span><i><span class="dot" style="background:#e76f51"></span>Not paid</i><b>${un.length}</b></span></div>
    </div>
    <div class="card"><h3>Recent check-ins</h3><div class="list">${recent.length ? recent.map(f => `<div class="row"><span class="av">${initials(f.parent)}</span><div class="grow">${esc(f.parent.split(' ').pop())} family<small>${inCount(f)} of ${people(f)} in</small></div><small class="muted">${esc(f.checkins.at(-1))}</small></div>`).join('') : '<p class="muted">No check-ins yet.</p>'}</div></div>
    <div class="card"><h3>Before the event</h3>${reviewItems(list).slice(0, 4).map(([n, t, ok]) => `<div class="check"><span class="n ${ok ? 'ok' : 'warn'}">${ok ? '✓' : n}</span><span class="grow">${t}</span></div>`).join('')}<button class="btn ghost sm" style="margin-top:10px" data-act="view" data-v="review">Open pre-event review</button></div>
  </div>`;
}
function filtered(list) {
  const q = S.q.trim().toLowerCase();
  return list.filter(f => (S.pay === 'all' || f.status === S.pay) && (!q || f.code.toLowerCase().includes(q) || f.members.some(m => m.name.toLowerCase().includes(q))));
}
function regs(ev, list) {
  const rows = filtered(list);
  return head('Registrations', `${list.length} families · ${list.reduce((n, f) => n + people(f), 0)} people · ${esc(ev.name)}`, `<button class="btn ghost" data-act="view" data-v="reports">Export</button>`) +
  `<div class="toolbar"><input type="text" id="q" placeholder="Search parent or student name, or ticket code" value="${esc(S.q)}" data-act="q">
    <select data-act="payf" aria-label="Payment filter">${[['all', 'All payments'], ['verified', 'Verified'], ['pending', 'Pending'], ['unpaid', 'Not paid']].map(([v, l]) => `<option value="${v}" ${S.pay === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
  <div class="card" style="padding:4px 8px;overflow:auto"><table><thead><tr><th>Family</th><th>Students</th><th class="hide-sm">Ticket</th><th>Payment</th><th class="hide-sm">Checked in</th></tr></thead><tbody>
  ${rows.map(f => `<tr class="click" data-act="openfam" data-v="${f.id}"><td><b>${esc(f.parent)}</b>${f.walkin ? ' <span class="pill in">Walk-in</span>' : ''}<br><small class="muted">${people(f)} people</small></td><td>${esc(f.members.filter(m => m.grade).map(m => m.name.split(' ')[0] + ' (' + m.grade + ')').join(', ') || '—')}</td><td class="hide-sm"><code>${esc(f.code)}</code></td><td>${PILL[f.status]}<br><small class="muted">${esc(f.method || '')} ${money(amount(f))}</small></td><td class="hide-sm">${inCount(f)}/${people(f)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No matches.</td></tr>'}
  </tbody></table></div>`;
}
function drawer() {
  const f = fams.find(x => x.id === S.open), ev = evOf(f.ev);
  return `<div class="drawer-bg" data-act="close"><div class="drawer" role="dialog" aria-label="Family details" data-stop>
    <div class="top" style="margin:0"><div><h1 style="font-size:18px">${esc(f.parent)}</h1><p class="muted">${esc(ev.name)} · <code>${esc(f.code)}</code></p></div><button class="btn ghost sm" data-act="close">Close</button></div>
    <div class="note">Volunteers on other phones see check-ins instantly, so nobody checks in twice.</div>
    <div class="list">${f.members.map((m, i) => `<div class="member ${m.in ? 'on' : ''}"><div class="grow"><b>${esc(m.name)}</b><small>${m.grade ? 'Student · Grade ' + esc(m.grade) : 'Adult'}</small></div><button class="btn sm ${m.in ? 'ghost' : ''}" data-act="toggle" data-v="${f.id}" data-i="${i}">${m.in ? 'Undo' : 'Check in'}</button></div>`).join('')}</div>
    <button class="btn" data-act="allin" data-v="${f.id}">Check in whole family</button>
    <div class="card" style="display:grid;gap:10px"><h3>Payment · ${money(amount(f))}</h3>
      <label class="f">Status<select data-act="setpay" data-v="${f.id}">${[['verified', 'Verified'], ['pending', 'Pending'], ['unpaid', 'Not paid']].map(([v, l]) => `<option value="${v}" ${f.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="f">Paid by<select data-act="setmethod" data-v="${f.id}"><option value="">—</option>${METHODS.map(m => `<option ${f.method === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
      ${f.pizza ? `<p>🍕 Pizza: ${f.pizza} order${f.pizza > 1 ? 's' : ''}</p>` : ''}
    </div>
    <div class="card" style="display:grid;gap:10px;justify-items:center"><h3 style="justify-self:start">Digital ticket</h3>${qrSvg(f.code)}<small class="muted">${f.sent ? 'Emailed to ' + esc(f.email) : 'Not sent yet'}</small><button class="btn ghost sm" data-act="resend" data-v="${f.id}">Re-send ticket</button></div>
  </div></div>`;
}
function desk(ev, list) {
  const q = S.desk.trim().toLowerCase();
  const hits = q.length < 2 ? [] : list.filter(f => f.code.toLowerCase() === q || f.members.some(m => m.name.toLowerCase().includes(q))).slice(0, 8);
  const reg = list.reduce((n, f) => n + people(f), 0), ins = list.reduce((n, f) => n + inCount(f), 0);
  return head('Check-in desk', `${esc(ev.name)} · ${ins} of ${reg} checked in`, `<button class="btn gold" data-act="scan">📷 Scan a ticket</button>`) +
  `<div class="grid2"><div style="display:grid;gap:12px;align-content:start">
    <input type="text" class="desk-search" id="desk" placeholder="Type a parent or student name…" value="${esc(S.desk)}" data-act="desk" autocomplete="off">
    ${hits.map(f => `<div class="result ${inCount(f) === people(f) ? 'done' : ''}"><span class="av">${initials(f.parent)}</span><div class="grow"><b>${esc(f.parent)}</b> ${PILL[f.status]}<small>${esc(f.members.map(m => m.name.split(' ')[0]).join(', '))} · ${inCount(f)}/${people(f)} in</small></div><button class="btn sm ghost" data-act="openfam" data-v="${f.id}">Details</button><button class="btn sm" data-act="allin" data-v="${f.id}" ${inCount(f) === people(f) ? 'disabled' : ''}>${inCount(f) === people(f) ? 'All in ✓' : 'Check in all'}</button></div>`).join('')}
    ${q.length >= 2 && !hits.length ? '<p class="muted">No match. Add them as a walk-in →</p>' : ''}
    ${q.length < 2 ? '<p class="muted">Search works for grandparents and carpools too: try a child\'s name.</p>' : ''}
  </div>
  <div class="card" style="display:grid;gap:10px;align-content:start"><h3>Add a walk-in</h3>
    <label class="f">Name<input type="text" id="wName" placeholder="e.g. Jordan Blake"></label>
    <label class="f">How many people<input type="number" id="wCount" min="1" value="1"></label>
    <label class="f">Payment<select id="wPay"><option value="Cash">Paid cash</option><option value="Zelle">Paid by Zelle</option><option value="">Not paid yet</option></select></label>
    <button class="btn" data-act="walkin">Add & check in</button>
    <div class="note">Paid / Not paid shows at the door so volunteers know who gets a wristband.</div>
  </div></div>`;
}
function pay(ev, list) {
  const todo = list.filter(f => f.status !== 'verified');
  return head('Payments', `${esc(ev.name)} · Zelle, cash, check and envelopes`, '') +
  `<div class="note" style="margin-bottom:12px">Envelope sent to school? Mark it <b>Pending</b> when the family signs up, then <b>Verified</b> when the mailbox is checked. The family gets an updated ✅ ticket automatically.</div>
  <div class="card" style="padding:4px 8px;overflow:auto"><table><thead><tr><th>Family</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>
  ${todo.map(f => `<tr><td><b>${esc(f.parent)}</b><br><small class="muted">${esc(f.method || 'No method yet')}</small></td><td>${money(amount(f))}</td><td>${PILL[f.status]}</td><td style="text-align:right"><select data-act="quickmethod" data-v="${f.id}" aria-label="Method" style="width:auto"><option value="">Paid by…</option>${METHODS.map(m => `<option ${f.method === m ? 'selected' : ''}>${m}</option>`).join('')}</select> <button class="btn sm" data-act="verify" data-v="${f.id}">Mark verified</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Everyone is verified. 🎉</td></tr>'}
  </tbody></table></div>`;
}
function reviewItems(list) {
  const pen = list.filter(f => f.status === 'pending').length, un = list.filter(f => f.status === 'unpaid').length, ns = list.filter(f => !f.sent).length, nk = list.filter(f => !f.members.some(m => m.grade)).length;
  return [[un, `${un} famil${un === 1 ? 'y has' : 'ies have'} not paid`, !un], [pen, `${pen} payment${pen === 1 ? ' is' : 's are'} pending (envelopes / Zelle to confirm)`, !pen], [ns, `${ns} ticket${ns === 1 ? '' : 's'} not emailed yet`, !ns], [nk, `${nk} registration${nk === 1 ? '' : 's'} without a student name`, !nk]];
}
function review(ev, list) {
  return head('Pre-event review', `${esc(ev.name)} · double-check everything before the day`, `<button class="btn" data-act="sendall">Send reminders to unpaid</button>`) +
  `<div class="card">${reviewItems(list).map(([n, t, ok]) => `<div class="check"><span class="n ${ok ? 'ok' : 'warn'}">${ok ? '✓' : n}</span><span class="grow">${t}</span>${ok ? '' : `<button class="btn ghost sm" data-act="view" data-v="${t.includes('paid') ? 'pay' : 'regs'}">Review</button>`}</div>`).join('')}</div>`;
}
function reports(ev, list) {
  const reg = list.reduce((n, f) => n + people(f), 0), ins = list.reduce((n, f) => n + inCount(f), 0), ver = list.filter(f => f.status === 'verified').reduce((n, f) => n + amount(f), 0);
  return head('Reports & export', esc(ev.name), '') +
  `<div class="stats"><div class="card stat"><div><b>${list.length}</b><span>Families</span></div></div><div class="card stat"><div><b>${reg}</b><span>People registered</span></div></div><div class="card stat"><div><b>${ins}</b><span>Attended</span></div></div><div class="card stat"><div><b>${money(ver)}</b><span>Verified payments</span></div></div></div>
  <div class="card" style="display:grid;gap:10px;justify-items:start"><h3>Download</h3><p class="muted">Opens in Excel, Numbers or Google Sheets.</p><button class="btn" data-act="csv">Download registrations (CSV)</button></div>`;
}
function emails(ev) {
  const box = (title, lines) => `<div class="email"><div class="head">${title}</div><div class="body">${lines}</div></div>`;
  return head('Automated emails', 'Sent for you. Each event team can edit the wording.', '') +
  `<div class="grid3">${box('Confirmation + ticket', `<b>You're registered for ${esc(ev.name)}!</b><p>${esc(ev.date)} · ${esc(ev.time)}<br>${esc(ev.place)}</p><p>Your family ticket and QR code are attached. Show it at the door.</p>`)}
  ${box('Payment reminder', `<b>Friendly reminder</b><p>We haven't received payment for ${esc(ev.name)} yet. Zelle, cash or check are all fine.</p>`)}
  ${box('Day-before reminder', `<b>See you tomorrow!</b><p>${esc(ev.name)} starts at ${esc(ev.time.split('–')[0])}. Have your ticket ready, or just give your name at the door.</p>`)}</div>`;
}
/* ---------------- parent phone ---------------- */
function parent() {
  let body = '';
  if (S.pv === 'events' && !S.pev) body = `<h2 style="color:var(--navy)">Upcoming events</h2>` + EVENTS.map(e => `<div class="card evcard" data-act="pev" data-v="${e.id}"><h3>${esc(e.name)}</h3><span class="muted">${esc(e.date)} · ${esc(e.time)}</span><span>${e.price ? money(e.price) + ' per ' + e.unit : 'Free'}</span></div>`).join('');
  else if (S.pv === 'events' && S.pev) body = signup(evOf(S.pev));
  else if (S.pv === 'tickets') body = tickets();
  else if (S.pv === 'checkin') body = selfCheck();
  return `<div class="phone"><div class="p-head"><img src="${LION}" alt=""><div><b>Lakeville PTA</b><small>Events</small></div></div><div class="p-body">${body}</div>
  <nav class="p-tabs">${[['events', 'Events'], ['tickets', 'My tickets'], ['checkin', 'Check in']].map(([id, l]) => `<button data-act="pv" data-v="${id}" ${S.pv === id ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav></div>`;
}
function signup(ev) {
  return `<button class="back" data-act="pev" data-v="">← All events</button>
  <div class="card" style="display:grid;gap:6px"><h2 style="color:var(--navy)">${esc(ev.name)}</h2><span class="muted">${esc(ev.date)} · ${esc(ev.time)} · ${esc(ev.place)}</span><p>${esc(ev.note)}</p></div>
  <form class="card" style="display:grid;gap:10px" data-form="signup">
    <label class="f">Parent / guardian name<input type="text" name="parent" required placeholder="Your name"></label>
    <label class="f">Email for your ticket<input type="email" name="email" required placeholder="you@example.com"></label>
    <div class="f" style="display:grid;gap:6px"><span>Students</span>
      <div class="kid"><input type="text" name="kid1" required placeholder="Student name"><select name="g1" style="width:80px">${['K', '1', '2', '3', '4', '5'].map(g => `<option>${g}</option>`).join('')}</select></div>
      <div class="kid"><input type="text" name="kid2" placeholder="Another student (optional)"><select name="g2" style="width:80px">${['K', '1', '2', '3', '4', '5'].map(g => `<option>${g}</option>`).join('')}</select></div></div>
    <label class="f">Other adults coming<input type="number" name="adults" min="0" value="0"></label>
    ${ev.extra ? `<label class="f">${esc(ev.extra)}<input type="number" name="pizza" min="0" value="0"></label>` : ''}
    ${ev.price || ev.extra ? `<label class="f">How will you pay?<select name="method"><option>Zelle</option><option>Cash</option><option>Check</option><option>Envelope to school</option></select></label><small class="muted">The PTA confirms your payment and your ticket updates automatically.</small>` : ''}
    <button class="btn" type="submit">Sign up</button></form>`;
}
function ticketCard(f) {
  const ev = evOf(f.ev);
  return `<div class="ticket"><div class="t-top"><b>${esc(ev.name)}</b><br><small>${esc(ev.date)} · ${esc(ev.time)} · ${esc(ev.place)}</small></div>
  <div class="t-mid">${qrSvg(f.code)}<code>${esc(f.code)}</code>${PILL[f.status]}</div>
  <div class="t-bot"><b>${esc(f.parent)}</b><span>${esc(f.members.map(m => m.name.split(' ')[0]).join(', '))} · ${people(f)} people</span>${f.pizza ? `<span>🍕 ${f.pizza} pizza order${f.pizza > 1 ? 's' : ''}</span>` : ''}<span>${money(amount(f))} ${f.method ? '· ' + esc(f.method) : ''}</span></div></div>`;
}
function tickets() {
  const mine = fams.filter(f => S.myTickets.includes(f.id));
  return `<h2 style="color:var(--navy)">My tickets</h2>` + (mine.length ? mine.map(ticketCard).join('') : `<div class="card"><p>No tickets yet. Sign up for an event and your ticket appears here (and in your email).</p></div>`);
}
function selfCheck() {
  const mine = fams.filter(f => S.myTickets.includes(f.id));
  if (!mine.length) return `<div class="card"><p>Sign up for an event first. At the door, scan the QR code on the sign to check yourself in.</p></div>`;
  const f = fams.find(x => x.id === S.showTicket) || mine[mine.length - 1];
  if (inCount(f) === people(f)) return `<div class="ok-screen ${f.status === 'verified' ? '' : 'pending'}"><div class="big">${f.status === 'verified' ? '✓' : '!'}</div><h2>${f.status === 'verified' ? 'You’re checked in!' : 'Checked in · payment pending'}</h2><p>${esc(evOf(f.ev).name)}<br>${esc(f.members.map(m => m.name.split(' ')[0]).join(', '))}</p><p><b>Show this screen to a PTA volunteer.</b></p><small>${esc(f.checkins.at(-1) || '')}</small></div>`;
  return `<div class="card" style="display:grid;gap:10px;text-align:center;justify-items:center"><h2 style="color:var(--navy)">Self check-in</h2><p class="muted">At the door, scan the event QR sign, or tap below.</p>${ticketCard(f)}<button class="btn gold" data-act="selfin" data-v="${f.id}">I’m here: check us in</button></div>`;
}
/* ---------------- render + actions ---------------- */
function render() {
  const focus = document.activeElement?.id, caret = document.activeElement?.selectionStart;
  $('#app').innerHTML = (S.mode === 'admin' ? admin() : parent()) + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  $('#mode-admin').setAttribute('aria-pressed', S.mode === 'admin'); $('#mode-parent').setAttribute('aria-pressed', S.mode === 'parent');
  if (focus && $('#' + focus)) { const el = $('#' + focus); el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch {} }
}
function checkIn(f, idxs) { idxs.forEach(i => f.members[i].in = true); f.checkins.push(nowTime()); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'close' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const v = t.dataset.v, f = fams.find(x => x.id === v);
  switch (t.dataset.act) {
    case 'mode': S.mode = v; S.open = null; break;
    case 'view': S.view = v; S.open = null; break;
    case 'openfam': S.open = v; break;
    case 'close': S.open = null; break;
    case 'toggle': { const m = f.members[+t.dataset.i]; m.in = !m.in; if (m.in) f.checkins.push(nowTime()); break; }
    case 'allin': checkIn(f, f.members.map((_, i) => i).filter(i => !f.members[i].in)); toast(`${f.parent.split(' ').pop()} family checked in ✓`); return;
    case 'verify': f.status = 'verified'; if (!f.method) f.method = 'Zelle'; toast(`Verified · updated ✅ ticket emailed to ${f.email}`); return;
    case 'resend': f.sent = true; toast(`Ticket re-sent to ${f.email}`); return;
    case 'sendall': toast('Reminders sent to families who haven’t paid'); return;
    case 'scan': { const c = famsOf(S.ev).find(x => inCount(x) < people(x)); if (c) { S.open = c.id; toast(`Scanned ${c.code}`); } else toast('Everyone is checked in'); return; }
    case 'walkin': { const name = $('#wName').value.trim(), n = Math.max(1, +$('#wCount').value || 1), m = $('#wPay').value; if (!name) { toast('Add a name for the walk-in'); return; }
      const w = { id: 'w' + Date.now(), ev: S.ev, code: ('WALK-' + Math.floor(Math.random() * 9000 + 1000)), parent: name, email: '', members: Array.from({ length: n }, (_, i) => ({ name: i ? name.split(' ').pop() + ' guest ' + i : name, in: true })), status: m ? 'verified' : 'unpaid', method: m, pizza: 0, sent: false, walkin: true, checkins: [nowTime()] };
      fams.push(w); toast(`${name} added and checked in${m ? ' · paid ' + m : ' · not paid'}`); return; }
    case 'csv': { const rows = [['Family', 'Email', 'Students', 'People', 'Checked in', 'Payment', 'Method', 'Amount', 'Ticket']].concat(famsOf(S.ev).map(f => [f.parent, f.email, f.members.filter(m => m.grade).map(m => m.name).join('; '), people(f), inCount(f), f.status, f.method, amount(f), f.code]));
      const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = evOf(S.ev).name.replace(/\s+/g, '-').toLowerCase() + '-registrations.csv'; document.body.append(a); a.click(); a.remove(); toast('CSV downloaded'); return; }
    case 'pv': S.pv = v; S.pev = null; break;
    case 'pev': S.pev = v || null; break;
    case 'selfin': checkIn(f, f.members.map((_, i) => i)); break;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target, f = fams.find(x => x.id === t.dataset.v);
  if (t.dataset.act === 'ev') { S.ev = t.value; S.open = null; }
  else if (t.dataset.act === 'payf') S.pay = t.value;
  else if (t.dataset.act === 'setpay') { f.status = t.value; if (t.value === 'verified') toast('Verified · updated ✅ ticket emailed'); }
  else if (t.dataset.act === 'setmethod' || t.dataset.act === 'quickmethod') f.method = t.value;
  else return;
  render();
});
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'q') { S.q = e.target.value; render(); }
  if (e.target.dataset.act === 'desk') { S.desk = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'signup') return; e.preventDefault();
  const d = new FormData(e.target), ev = evOf(S.pev), last = String(d.get('parent')).trim().split(' ').pop();
  const kids = [[d.get('kid1'), d.get('g1')], [d.get('kid2'), d.get('g2')]].filter(([n]) => String(n || '').trim()).map(([n, g]) => ({ name: String(n).trim().includes(' ') ? String(n).trim() : String(n).trim() + ' ' + last, grade: g, in: false }));
  const adults = [{ name: String(d.get('parent')).trim(), in: false }, ...Array.from({ length: +d.get('adults') || 0 }, (_, i) => ({ name: last + ' adult ' + (i + 2), in: false }))];
  const f = { id: 'me' + Date.now(), ev: ev.id, code: (ev.id + '-' + Math.floor(Math.random() * 9000 + 1000)).toUpperCase(), parent: adults[0].name, email: String(d.get('email')), members: [...adults, ...kids], status: ev.price || +d.get('pizza') ? 'pending' : 'verified', method: String(d.get('method') || ''), pizza: +d.get('pizza') || 0, sent: true, walkin: false, checkins: [] };
  fams.push(f); S.myTickets.push(f.id); S.showTicket = f.id; S.pv = 'tickets'; S.pev = null; S.ev = ev.id;
  toast('You’re signed up! Ticket emailed to ' + f.email);
});
render();
</script>
</body>
</html>
